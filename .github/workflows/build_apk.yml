name: Build Super Accounting APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-installed Android SDK & Gradle
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          yes | /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Super Accounting Android APK
        run: |
          # 1. Remove any conflicting old config.xml from root so Cordova doesn't get confused
          rm -f config.xml package.json package-lock.json network_security_config.xml
          rm -f www/config.xml Super_Accounting_Android_App/config.xml

          npm install -g cordova
          cordova create super_apk com.superaccounting.app "Super Accounting"
          
          # 2. Copy web files into super_apk/www/
          if [ -d "www" ]; then
            cp -r www/* super_apk/www/
          elif [ -d "Super_Accounting_Android_App/www" ]; then
            cp -r Super_Accounting_Android_App/www/* super_apk/www/
          elif [ -f "index.html" ]; then
            cp -f index.html super_apk/www/
          fi
          rm -f super_apk/www/config.xml
          
          # 3. Copy custom logo/assets into super_apk/www/assets/
          mkdir -p super_apk/www/assets
          if [ -d "assets" ]; then
            cp -r assets/* super_apk/www/assets/ 2>/dev/null || true
          elif [ -d "Super_Accounting_Android_App/assets" ]; then
            cp -r Super_Accounting_Android_App/assets/* super_apk/www/assets/ 2>/dev/null || true
          fi
          if [ -f "icon.png" ]; then
            cp -f icon.png super_apk/www/assets/icon.png
          fi

          cd super_apk
          
          # 4. Allow phone call (tel:) and internet access in clean config.xml
          sed -i 's|</widget>|  <allow-intent href="tel:*" />\n  <allow-navigation href="*" />\n  <access origin="*" />\n</widget>|g' config.xml
          
          cordova platform add android@13.0.0

          # 5. Apply Custom App Logo to Android Launcher Icons
          ICON_FILE=""
          if [ -f "www/assets/icon.png" ]; then
            ICON_FILE="www/assets/icon.png"
          elif [ -f "www/icon.png" ]; then
            ICON_FILE="www/icon.png"
          fi
          if [ -n "$ICON_FILE" ]; then
            for dir in platforms/android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp -f "$ICON_FILE" "$dir/ic_launcher.png" 2>/dev/null || true
                cp -f "$ICON_FILE" "$dir/ic_launcher_round.png" 2>/dev/null || true
                cp -f "$ICON_FILE" "$dir/ic_launcher_foreground.png" 2>/dev/null || true
              fi
            done
            rm -rf platforms/android/app/src/main/res/mipmap-anydpi-v26
          fi
          
          # 6. Inject Microphone, Call & Cleartext Permissions into AndroidManifest.xml
          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CALL_PHONE" />\n    <application android:usesCleartextTraffic="true"|g' "$MANIFEST"

          # 7. Inject Native Android Google Speech Recognizer Bridge into MainActivity.java
          MAIN_ACT="platforms/android/app/src/main/java/com/superaccounting/app/MainActivity.java"
          cat << 'EOF' > "$MAIN_ACT"
          package com.superaccounting.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.speech.RecognizerIntent;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.util.ArrayList;
          import org.apache.cordova.*;
          import org.json.JSONObject;

          public class MainActivity extends CordovaActivity {
              private static final int VOICE_REQ_CODE = 999;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Bundle extras = getIntent().getExtras();
                  if (extras != null && extras.getBoolean("cdvStartInBackground", false)) {
                      moveTaskToBack(true);
                  }
                  loadUrl(launchUrl);

                  try {
                      WebView wv = (WebView) appView.getEngine().getView();
                      wv.getSettings().setMediaPlaybackRequiresUserGesture(false);
                      wv.addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void startVoice() {
                              runOnUiThread(() -> {
                                  try {
                                      Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");
                                      intent.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 2500L);
                                      intent.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 2500L);
                                      intent.putExtra(RecognizerIntent.EXTRA_PROMPT, "बोलें: ग्राहक का नाम, राशि और जमा/उधार");
                                      startActivityForResult(intent, VOICE_REQ_CODE);
                                  } catch (Exception e) {
                                      wv.evaluateJavascript("alert('Google Voice Typing app is not enabled on this phone.');", null);
                                  }
                              });
                          }
                      }, "AndroidNativeVoice");
                  } catch (Exception ignored) {}

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent intent) {
                  super.onActivityResult(requestCode, resultCode, intent);
                  if (requestCode == VOICE_REQ_CODE && resultCode == Activity.RESULT_OK && intent != null) {
                      ArrayList<String> results = intent.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                      if (results != null && !results.isEmpty()) {
                          final String spokenText = results.get(0);
                          try {
                              final WebView wv = (WebView) appView.getEngine().getView();
                              wv.post(() -> {
                                  String safeJsText = JSONObject.quote(spokenText);
                                  wv.evaluateJavascript("if(window.onAndroidVoiceResult){window.onAndroidVoiceResult(" + safeJsText + ");}", null);
                              });
                          } catch (Exception ignored) {}
                      }
                  }
              }
          }
          EOF

          CHROME_CLIENT="platforms/android/CordovaLib/src/org/apache/cordova/engine/SystemWebChromeClient.java"
          if [ -f "$CHROME_CLIENT" ]; then
            sed -i 's|public void onPermissionRequest(final PermissionRequest request) {|public void onPermissionRequest(final PermissionRequest request) {\n        request.grant(request.getResources());\n        if (true) return;|g' "$CHROME_CLIENT"
          fi
          
          cordova build android --debug
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../Super_Accounting.apk

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Super_Accounting_APK
          path: Super_Accounting.apk
